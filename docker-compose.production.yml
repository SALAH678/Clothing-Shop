x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    container_name: clothing_shop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - cs-backend-network
    volumes:
      - db_data:/var/lib/postgresql
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seq:
    image: datalust/seq:2025
    container_name: clothing_shop_seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINUSERNAME: ${SEQ_FIRSTRUN_ADMINUSERNAME}
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_FIRSTRUN_ADMINPASSWORD}
    ports:
      - "127.0.0.1:5341:80"           # localhost only; reach it via SSH tunnel
    networks:
      - cs-backend-network
    volumes:
      - seq_data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clothing_shop_api:1.0
    container_name: clothing_shop_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - JwtSettings__SecretKey=${SECRET_KEY}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Serilog__WriteTo__0__Name=Seq
      - Serilog__WriteTo__0__Args__serverUrl=http://seq:80
      - Email__EmailAdmin=${EMAILADMIN}
      - Chargily__WebhookEndpointUrl=https://${DOMAIN}/api/purchases/webhook/payment
    depends_on:
      db:
        condition: service_healthy
      seq:
        condition: service_healthy
    expose:
      - "8080"                        # reachable by nginx only, not published
    networks:
      - cs-backend-network
    volumes:
      - images:/app/wwwroot/images
    logging: *default-logging

  web:
    build:
      context: ./frontend
      dockerfile: production.Dockerfile
      args:
        VITE_API_URL: /api
    image: clothing_shop_web:1.0
    container_name: clothing_shop_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - cs-backend-network
    logging: *default-logging

  certbot:
    image: certbot/certbot
    container_name: clothing_shop_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    logging: *default-logging

volumes:
  db_data:
  seq_data:
  images:
  certbot_conf:
  certbot_www:

networks:
  cs-backend-network:
    driver: bridge