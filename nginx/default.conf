# Docker's internal DNS. Lets nginx re-resolve "api" instead of caching its IP forever.
resolver 127.0.0.11 valid=10s;

# ---- Port 80: certbot challenges + redirect everything else ----
server {
    listen 80;
    listen [::]:80;
    server_name clothing-shop.mo-salah.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Port 443: the real site ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clothing-shop.mo-salah.tech;

    ssl_certificate     /etc/letsencrypt/live/clothing-shop.mo-salah.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clothing-shop.mo-salah.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10m;          # product image uploads; adjust to your limit

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;   # raise to 1 year once stable

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    root /usr/share/nginx/html;
    index index.html;

    # Variable form + resolver = nginx re-resolves "api" after it is rebuilt
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files: cache for a year
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # add_header here REPLACES the server-level ones (see gotcha 1), so repeat what you need
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # React app + SPA fallback
    location / {
        try_files $uri /index.html;
    }
}